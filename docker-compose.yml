x-app: &app
  image: review-automation:local
  build: .
  env_file: .env                     # your secrets: GROQ_API_KEY, tokens, ...
  restart: unless-stopped
  environment: &app-env
    REDIS_URL: redis://redis:6379/0          # "redis" = the service name below
    CELERY_BROKER_URL: redis://redis:6379/1
    LOG_FORMAT: json
  depends_on:
    redis:
      condition: service_healthy

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *app
    ports: ["127.0.0.1:8000:8000"]   # reachable from this machine only
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    <<: *app
    environment:
      <<: *app-env
      PROMETHEUS_MULTIPROC_DIR: /tmp/prom
    command: >
      sh -c "rm -rf /tmp/prom && mkdir -p /tmp/prom &&
             celery -A app.workers.celery_app worker -Q review_jobs -l info --concurrency=2"

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    depends_on: [api, worker]

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]

  # Public HTTPS front door. Only started on the AWS server (--profile prod).
  caddy:
    image: caddy:2-alpine
    profiles: ["prod"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]

volumes:
  redis_data:
  prometheus_data:
  grafana_data:
  caddy_data:
  caddy_config: