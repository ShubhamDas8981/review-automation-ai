[project]
name = "review-automation"
version = "0.1.0"
description = "WhatsApp review triage: LLM classification, guardrails, HubSpot tickets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "httpx>=0.27",
    "requests>=2.32",
    "groq>=0.11",
    "langgraph>=0.2",
    "guardrails-ai>=0.5",
    "prometheus-client>=0.20",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "fakeredis>=2.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
